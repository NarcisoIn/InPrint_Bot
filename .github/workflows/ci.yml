name: InPrint CI

# El robot se activa cuando hagas push a la rama 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Trabajo 1: Escanear el código Python en busca de errores
  lint:
    name: Revisar código Python
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependencias de revisión
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Analizar sintaxis con Flake8
        run: |
          # Detiene el proceso si detecta errores críticos (sintaxis, variables sin definir)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Trabajo 2: Verificar que el contenedor se construya sin errores
  docker-build:
    name: Probar Build de Docker
    needs: lint # Solo arranca si el Trabajo 1 pasó sin problemas
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Construir imagen de Docker
        # Simula la construcción en la nube para garantizar que no fallará en tu Raspberry
        run: docker build -t inprint-test:latest .